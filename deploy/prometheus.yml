global:
  scrape_interval: 15s

scrape_configs:
  - job_name: triage-api
    # Discovers every replica through Docker DNS, so scaling needs no config change.
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000
        refresh_interval: 10s
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
