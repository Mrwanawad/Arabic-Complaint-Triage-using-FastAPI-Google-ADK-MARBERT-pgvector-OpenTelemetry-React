events {
    worker_connections 1024;
}

http {
    # Docker DNS: re-resolve so replicas added with --scale join the pool.
    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=classify:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;
    limit_req_status 429;

    upstream api {
        zone api_upstream 64k;
        least_conn;
        server api:8000 resolve max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        client_max_body_size 25m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Retry safe failures on another replica. Classify retries are safe for clients that send
        # external_id, because ticket_id then deduplicates them.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;

        location /classify {
            limit_req zone=classify burst=40 nodelay;
            proxy_pass http://api;
        }

        location /metrics {
            # Prometheus scrapes replicas directly over the Compose network.
            return 404;
        }

        location / {
            limit_req zone=general burst=100 nodelay;
            proxy_pass http://api;
        }
    }
}
