[project]
name = "arabic-complaint-triage"
version = "0.1.0"
description = "Arabic and Franco-Arabic telecom complaint triage with an encoder-first, LLM-fallback pipeline."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "onnxruntime>=1.19",
    "tokenizers>=0.19",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "lightgbm>=4.5",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "google-adk>=1.0",
    "litellm>=1.50",
    "fastmcp>=2.3",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-exporter-prometheus>=0.48b0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.2", "av>=14,<16"]
train = [
    "torch>=2.3",
    "transformers>=4.44",
    "onnx>=1.16",
    "pandas>=2.2,<3",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.22",
    "wordcloud>=1.9",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.6",
    "cleanlab>=2.6",
    "imbalanced-learn>=0.12",
    "optuna>=3.6",
    "mlflow>=2.14",
    "lime>=0.2",
    "evidently>=0.7",
]
eval = ["deepeval>=4", "ragas>=0.4", "langchain-community<0.4"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pgserver>=0.1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "postgres: needs a local PostgreSQL with pgvector",
    "live: calls real LLM providers and needs API keys",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "RUF012"]
